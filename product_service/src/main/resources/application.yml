spring:
  application:
    name: product_service

  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./product_service/.env[.properties]"

  datasource:
    url: ${DATABASE_URL}
    username: ${USERNAME}
    password: ${PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
