input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  udp {
    port => 5000
    codec => json
  }
}

output {
  if [app_name] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ecommerce-logs-%{+YYYY.MM.dd}"
      data_stream => false
      ilm_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "unknown-ecommerce-logs-%{+YYYY.MM.dd}"
      data_stream => false
      ilm_enabled => false
    }
    # Show events without an application name in the Docker logs.
    stdout {
      codec => rubydebug
    }
  }
}
